# Dashboard Configuration

# General Settings
general:
  title: "CSV Toolkit Analytics"
  theme: "light"
  refresh_rate: 5000  # milliseconds
  retention_period: 30  # days
  max_data_points: 1000

# Data Collection
collection:
  enabled: true
  intervals:
    usage: 60  # seconds
    performance: 30  # seconds
    errors: 10  # seconds
  batch_size: 100
  storage:
    type: "sqlite"
    path: "data/metrics.db"
    backup_interval: 86400  # 24 hours

# Visualization
visualization:
  charts:
    - id: "memory_usage"
      type: "line"
      title: "Memory Usage"
      metric: "memory"
      color: "#1f77b4"
      refresh: 5000
      
    - id: "cpu_usage"
      type: "line"
      title: "CPU Usage"
      metric: "cpu"
      color: "#2ca02c"
      refresh: 5000
      
    - id: "tool_usage"
      type: "bar"
      title: "Tool Usage"
      metric: "tools"
      color: "#ff7f0e"
      refresh: 60000
      
    - id: "error_rates"
      type: "line"
      title: "Error Rates"
      metric: "errors"
      color: "#d62728"
      refresh: 30000

# Metrics
metrics:
  usage:
    active_users: true
    tool_usage: true
    processing_time: true
    success_rate: true
    
  performance:
    memory: true
    cpu: true
    disk_io: true
    network: true
    
  errors:
    validation: true
    processing: true
    system: true

# Alerts
alerts:
  memory_usage:
    enabled: true
    threshold: 90  # percent
    window: 300  # seconds
    cooldown: 1800  # seconds
    
  cpu_usage:
    enabled: true
    threshold: 80  # percent
    window: 300  # seconds
    cooldown: 1800  # seconds
    
  error_rate:
    enabled: true
    threshold: 5  # percent
    window: 3600  # seconds
    cooldown: 7200  # seconds

# Security
security:
  access_control:
    enabled: true
    roles:
      - admin
      - viewer
    
  authentication:
    required: true
    session_timeout: 3600  # seconds
    
  data_privacy:
    anonymize_user_data: true
    retention_period: 90  # days
    
# Integrations
integrations:
  email:
    enabled: true
    smtp:
      host: "smtp.example.com"
      port: 587
      use_tls: true
    
  slack:
    enabled: false
    webhook_url: ""
    
  prometheus:
    enabled: false
    port: 9090

# Logging
logging:
  level: "INFO"
  file: "logs/dashboard.log"
  max_size: 10485760  # 10MB
  backup_count: 5
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s" 