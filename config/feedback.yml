# Feedback Processing Configuration

# Collection Settings
collection:
  sources:
    github_issues:
      enabled: true
      interval: 300  # seconds
      max_items: 100
      
    discussions:
      enabled: true
      interval: 300  # seconds
      max_items: 100
      
    error_reports:
      enabled: true
      interval: 60  # seconds
      max_items: 50
      
    usage_metrics:
      enabled: true
      interval: 600  # seconds
      max_items: 1000

# Processing Settings
processing:
  batch_size: 100
  interval: 300  # seconds
  max_retries: 3
  timeout: 30  # seconds
  workers: 4
  queue_size: 1000

# Analysis Settings
analysis:
  sentiment:
    enabled: true
    model: "vader"
    threshold: 0.5
    
  classification:
    model: "default"
    confidence_threshold: 0.8
    min_text_length: 10
    max_text_length: 5000
    
  priority:
    factors:
      severity: 0.4
      frequency: 0.3
      impact: 0.3
    thresholds:
      high: 0.8
      medium: 0.5
      low: 0.2

# Categorization Rules
categories:
  bug_report:
    keywords:
      - "bug"
      - "error"
      - "crash"
      - "fail"
      - "issue"
    required_fields:
      - description
      - steps_to_reproduce
      - expected_behavior
    priority_factors:
      - severity
      - frequency
      - impact
    
  feature_request:
    keywords:
      - "feature"
      - "enhancement"
      - "request"
      - "add"
      - "improve"
    required_fields:
      - description
      - use_case
      - benefits
    priority_factors:
      - demand
      - complexity
      - value
    
  documentation:
    keywords:
      - "docs"
      - "documentation"
      - "guide"
      - "example"
      - "tutorial"
    required_fields:
      - description
      - section
    priority_factors:
      - clarity
      - completeness
      - importance

# Routing Rules
routing:
  bug_report:
    team: "development"
    priority: "high"
    sla: 24  # hours
    labels:
      - "bug"
      - "needs-triage"
    
  feature_request:
    team: "product"
    priority: "medium"
    sla: 72  # hours
    labels:
      - "enhancement"
      - "needs-review"
    
  documentation:
    team: "docs"
    priority: "medium"
    sla: 48  # hours
    labels:
      - "documentation"
      - "needs-review"

# Integration Settings
integrations:
  github:
    enabled: true
    auto_create_issues: true
    auto_assign: true
    label_prefix: "feedback:"
    
  notifications:
    email:
      enabled: true
      urgent_only: true
      recipients:
        - "dev-team@example.com"
        
    slack:
      enabled: true
      webhook_url: ""
      channels:
        high_priority: "#urgent-feedback"
        general: "#feedback"

# Monitoring
monitoring:
  metrics:
    enabled: true
    interval: 60  # seconds
    retention: 30  # days
    
  alerts:
    queue_size:
      threshold: 1000
      window: 300  # seconds
      
    processing_time:
      threshold: 10  # seconds
      window: 300  # seconds
      
    error_rate:
      threshold: 0.05  # 5%
      window: 3600  # seconds

# Security
security:
  data_protection:
    sanitize_pii: true
    encrypt_sensitive_data: true
    retention_period: 90  # days
    
  access_control:
    enabled: true
    roles:
      - admin
      - processor
      - viewer
    
  audit:
    enabled: true
    log_level: "INFO"
    retention: 90  # days

# Performance
performance:
  caching:
    enabled: true
    ttl: 3600  # seconds
    max_size: 1000
    
  rate_limiting:
    enabled: true
    max_requests: 100
    window: 60  # seconds 