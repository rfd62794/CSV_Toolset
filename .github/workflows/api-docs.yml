name: API Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'csv_toolset/**/*.py'
      - 'docs/api/**'
      - '.github/workflows/api-docs.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'csv_toolset/**/*.py'
      - 'docs/api/**'
      - '.github/workflows/api-docs.yml'

jobs:
  update-api-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-docs.txt
          pip install docstring-parser

      - name: Generate API documentation
        run: |
          python scripts/generate_api_docs.py

      - name: Check for changes
        id: git-check
        run: |
          git add docs/api/
          git diff --staged --quiet || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Create Pull Request
        if: steps.git-check.outputs.changes == 'true' && github.event_name == 'push'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "docs: Update API documentation"
          title: "docs: Update API documentation"
          body: |
            This PR updates the API documentation based on the latest code changes.
            
            Changes were automatically generated by the API documentation workflow.
          branch: update-api-docs
          delete-branch: true
          labels: documentation
          base: main 