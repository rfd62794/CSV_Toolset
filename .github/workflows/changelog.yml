name: Changelog

on:
  workflow_dispatch:
  pull_request:
    types: [closed]
    branches:
      - main
  release:
    types: [created]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        uses: mikepenz/release-changelog-builder-action@v4
        with:
          configuration: ".github/changelog-config.json"
          commitMode: true
          ignorePreReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update CHANGELOG.md
        if: github.event_name != 'pull_request'
        run: |
          VERSION="${{ github.event.release.tag_name || 'Unreleased' }}"
          DATE=$(date +%Y-%m-%d)
          
          # Create new changelog content
          echo "# Changelog" > CHANGELOG.new
          echo "" >> CHANGELOG.new
          echo "All notable changes to CSV Toolset will be documented in this file." >> CHANGELOG.new
          echo "" >> CHANGELOG.new
          echo "The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/)," >> CHANGELOG.new
          echo "and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html)." >> CHANGELOG.new
          echo "" >> CHANGELOG.new
          
          if [ "$VERSION" = "Unreleased" ]; then
            echo "## [Unreleased]" >> CHANGELOG.new
          else
            echo "## [$VERSION] - $DATE" >> CHANGELOG.new
          fi
          echo "" >> CHANGELOG.new
          echo "${{ steps.changelog.outputs.changelog }}" >> CHANGELOG.new
          echo "" >> CHANGELOG.new
          
          # Append existing changelog content after ## [Unreleased] section
          sed -n '/## \[/,$p' CHANGELOG.md | tail -n +2 >> CHANGELOG.new
          
          # Replace old changelog with new one
          mv CHANGELOG.new CHANGELOG.md

      - name: Create Pull Request
        if: github.event_name != 'pull_request' && github.event_name != 'release'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "docs: Update changelog"
          title: "docs: Update changelog"
          body: |
            This PR updates the changelog with recent changes.
            
            Changes were automatically generated by the changelog workflow.
          branch: update-changelog
          delete-branch: true
          labels: documentation

      - name: Update Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ steps.changelog.outputs.changelog }}
          token: ${{ secrets.GITHUB_TOKEN }} 