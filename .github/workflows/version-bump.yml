name: Version Bump

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Type of version bump'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      release_type:
        description: 'Release type'
        required: true
        type: choice
        options:
          - prod
          - dev
        default: 'prod'
  pull_request:
    types: [closed]
    branches:
      - main
    paths:
      - 'csv_toolset/**'
      - 'tests/**'
      - 'setup.py'
      - 'pyproject.toml'

jobs:
  bump-version:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && !contains(github.event.pull_request.labels.*.name, 'no-version-bump'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bump2version

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine version bump type
        id: bump-type
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "type=${{ github.event.inputs.bump_type }}" >> $GITHUB_OUTPUT
            echo "release=${{ github.event.inputs.release_type }}" >> $GITHUB_OUTPUT
          else
            # Determine bump type from PR labels
            if [[ "${{ contains(github.event.pull_request.labels.*.name, 'bump:major') }}" == "true" ]]; then
              echo "type=major" >> $GITHUB_OUTPUT
            elif [[ "${{ contains(github.event.pull_request.labels.*.name, 'bump:minor') }}" == "true" ]]; then
              echo "type=minor" >> $GITHUB_OUTPUT
            else
              echo "type=patch" >> $GITHUB_OUTPUT
            fi
            echo "release=prod" >> $GITHUB_OUTPUT
          fi

      - name: Bump version
        run: |
          BUMP_TYPE=${{ steps.bump-type.outputs.type }}
          RELEASE_TYPE=${{ steps.bump-type.outputs.release }}
          
          # Bump version and create tag
          bump2version --config-file .bumpversion.cfg $BUMP_TYPE
          
          # If this is a production release, remove any pre-release suffix
          if [ "$RELEASE_TYPE" = "prod" ]; then
            bump2version --config-file .bumpversion.cfg release
          fi
          
          # Push changes and tags
          git push
          git push --tags

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore: Bump version [skip ci]"
          title: "chore: Bump version"
          body: |
            This PR updates version numbers across the project.
            
            - Bump type: ${{ steps.bump-type.outputs.type }}
            - Release type: ${{ steps.bump-type.outputs.release }}
            
            This is an automated PR created by the version bump workflow.
          branch: bump-version
          delete-branch: true
          labels: version-bump

      - name: Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const issue_body = `Version bump failed!
            
            Workflow run: [View Run](${context.payload.repository.html_url}/actions/runs/${context.runId})
            
            Please check the workflow logs for more details.`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: "⚠️ Version bump failed",
              body: issue_body,
              labels: ["bug", "version-bump"]
            }); 