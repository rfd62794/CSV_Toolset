name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.8'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Extract release notes
      id: extract-release-notes
      run: |
        # Extract release notes from CHANGELOG.md
        VERSION=${GITHUB_REF#refs/tags/v}
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        awk "/## \[$VERSION\]/{flag=1;next}/## \[/{flag=0}flag" CHANGELOG.md > release_notes.md

    - name: Build package
      run: python -m build

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        body_path: release_notes.md
        files: |
          dist/*
        draft: false
        prerelease: false
        generate_release_notes: true

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
      run: |
        twine upload --skip-existing dist/*

    - name: Update documentation
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        pip install -r requirements-docs.txt
        mkdocs gh-deploy --force

    - name: Notify on success
      if: success()
      uses: actions/github-script@v7
      with:
        script: |
          const version = '${{ steps.extract-release-notes.outputs.version }}'
          const releaseUrl = `https://github.com/${{ github.repository }}/releases/tag/v${version}`
          const docsUrl = `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}`
          const pypiUrl = `https://pypi.org/project/${{ github.event.repository.name }}/${version}`
          
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            body: `🎉 Release v${version} has been published!\n\n` +
                  `- GitHub Release: ${releaseUrl}\n` +
                  `- Documentation: ${docsUrl}\n` +
                  `- PyPI Package: ${pypiUrl}`
          }) 