name: License Compliance Check

on:
  schedule:
    - cron: '0 0 * * 0'  # Run weekly on Sunday
  push:
    paths:
      - 'requirements*.txt'
      - 'setup.py'
      - 'pyproject.toml'
  pull_request:
    paths:
      - 'requirements*.txt'
      - 'setup.py'
      - 'pyproject.toml'
  workflow_dispatch:

jobs:
  license-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pip-licenses licensecheck
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -r requirements-docs.txt

      - name: Generate license report
        run: |
          # Generate detailed license report
          pip-licenses --format=json --with-authors --with-urls --with-description --no-license-path --output-file=license-report.json
          
          # Generate summary report
          pip-licenses --format=markdown --with-authors --with-urls --output-file=license-summary.md

      - name: Check license compatibility
        id: license-check
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const licenses = JSON.parse(fs.readFileSync('license-report.json', 'utf8'));
            
            // Define allowed licenses
            const allowedLicenses = [
              'MIT', 'BSD', 'Apache-2.0', 'ISC', 'Python-2.0',
              'MPL-2.0', 'LGPL-3.0', 'LGPL-2.1'
            ];
            
            // Define licenses requiring review
            const reviewLicenses = [
              'GPL-3.0', 'GPL-2.0', 'AGPL-3.0'
            ];
            
            let issues = [];
            let warnings = [];
            
            for (const pkg of licenses) {
              if (!pkg.license) {
                issues.push(`⚠️ No license found for ${pkg.name}`);
              } else if (!allowedLicenses.includes(pkg.license)) {
                if (reviewLicenses.includes(pkg.license)) {
                  warnings.push(`⚠️ License requires review: ${pkg.name} (${pkg.license})`);
                } else {
                  issues.push(`❌ Incompatible license: ${pkg.name} (${pkg.license})`);
                }
              }
            }
            
            // Create issue body
            let body = '# License Compliance Report\n\n';
            
            if (issues.length > 0) {
              body += '## Issues Found\n\n' + issues.join('\n') + '\n\n';
            }
            
            if (warnings.length > 0) {
              body += '## Warnings\n\n' + warnings.join('\n') + '\n\n';
            }
            
            body += '## License Summary\n\n';
            body += fs.readFileSync('license-summary.md', 'utf8');
            
            // Create issue if problems found
            if (issues.length > 0 || warnings.length > 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '📋 License Compliance Review Required',
                body: body,
                labels: ['license-check', 'dependencies']
              });
              
              if (issues.length > 0) {
                core.setFailed('License compliance issues found');
              }
            }

      - name: Update license documentation
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p docs/legal
          cp license-summary.md docs/legal/DEPENDENCIES.md
          
          # Add header to dependencies file
          echo "# Project Dependencies and Licenses\n\n" | cat - docs/legal/DEPENDENCIES.md > temp && mv temp docs/legal/DEPENDENCIES.md
          echo "Last updated: $(date +'%Y-%m-%d')\n\n" >> docs/legal/DEPENDENCIES.md

      - name: Create Pull Request for documentation update
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "docs: Update dependency license documentation"
          title: "docs: Update dependency license documentation"
          body: |
            This PR updates the dependency license documentation.
            
            - Updates DEPENDENCIES.md with current license information
            - Generated automatically by the license compliance workflow
          branch: update-license-docs
          delete-branch: true
          labels: documentation 