name: Documentation Versions

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to deploy (e.g., "1.0", "latest")'
        required: true
      alias:
        description: 'Version alias (e.g., "stable", "latest")'
        required: false

jobs:
  deploy-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install -r requirements-docs.txt
          pip install mike

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "alias=${{ github.event.inputs.alias }}" >> $GITHUB_OUTPUT
          else
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "alias=latest" >> $GITHUB_OUTPUT
          fi

      - name: Deploy version docs
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          ALIAS=${{ steps.get_version.outputs.alias }}
          
          # Build and deploy version
          mike deploy --push --update-aliases $VERSION $ALIAS
          
          # If this is a new version, set it as latest
          if [ "$ALIAS" = "latest" ]; then
            mike set-default --push latest
          fi

      - name: List versions
        run: mike list

      - name: Create version announcement
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const version = '${{ steps.get_version.outputs.version }}'
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📚 Documentation deployed for v${version}`,
              body: `Documentation for version ${version} has been deployed.\n\n` +
                    `View it at: https://${context.repo.owner}.github.io/${context.repo.name}/${version}/\n\n` +
                    `This version has also been set as the latest documentation.`,
              labels: ['documentation']
            }) 