site_name: CSV Toolset Documentation
site_description: Documentation for CSV processing and manipulation tools
repo_url: https://github.com/yourusername/CSV_Toolset
repo_name: CSV_Toolset

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/emoticon-happy-outline
          name: This page was helpful
          data: 1
          note: >-
            Thanks for your feedback!
        - icon: material/emoticon-sad-outline
          name: This page could be improved
          data: 0
          note: >- 
            Thanks for your feedback! Help us improve by using 
            our <a href="https://github.com/yourusername/CSV_Toolset/issues/new?title=[Docs]+">issue tracker</a>.

extra:
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY
    feedback:
      title: Was this page helpful?
      ratings:
        - icon: material/thumb-up-outline
          name: This page was helpful
          data: 1
        - icon: material/thumb-down-outline
          name: This page could be improved
          data: 0
  consent:
    title: Cookie consent
    description: >- 
      We use cookies to recognize your repeated visits and preferences, as well
      as to measure the effectiveness of our documentation and whether users
      find what they're searching for. With your consent, you're helping us to
      make our documentation better.
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername/CSV_Toolset
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/csv-toolset/

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - git-revision-date-localized:
      type: datetime
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true
  - analytics:
      provider: google
      property: !ENV GOOGLE_ANALYTICS_KEY
      feedback:
        title: Was this page helpful?
        ratings:
          - icon: material/thumb-up-outline
            name: This page was helpful
            data: 1
          - icon: material/thumb-down-outline
            name: This page could be improved
            data: 0

nav:
  - Home: index.md
  - Getting Started:
    - Installation: tutorials/getting_started.md
    - Quick Start: tutorials/quick_start.md
  - Tools:
    - CSV Data Truncator: tools/csv_data_truncator.md
    - CSV Column Splitter: tools/csv_column_splitter.md
    - CSV Inspector: tools/csv_inspector.md
    - Phone Column Extract: tools/phone_column_extract.md
    - Sample Maker: tools/sample_maker.md
  - Guides:
    - Data Cleaning: tutorials/data_cleaning.md
    - Performance Tips: tutorials/performance.md
    - Error Handling: tutorials/error_handling.md
  - Development:
    - Contributing: CONTRIBUTING.md
    - Code of Conduct: CODE_OF_CONDUCT.md
    - Security: SECURITY.md
  - Support:
    - Getting Help: SUPPORT.md
    - Changelog: CHANGELOG.md 