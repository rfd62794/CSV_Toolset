site_name: CSV Toolset Documentation
site_description: Documentation for CSV processing and manipulation tools
repo_url: https://github.com/yourusername/CSV_Toolset
repo_name: CSV_Toolset

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - git-revision-date-localized:
      type: datetime
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true

nav:
  - Home: index.md
  - Getting Started:
    - Installation: tutorials/getting_started.md
    - Quick Start: tutorials/quick_start.md
  - Tools:
    - CSV Data Truncator: tools/csv_data_truncator.md
    - CSV Column Splitter: tools/csv_column_splitter.md
    - CSV Inspector: tools/csv_inspector.md
    - Phone Column Extract: tools/phone_column_extract.md
    - Sample Maker: tools/sample_maker.md
  - Guides:
    - Data Cleaning: tutorials/data_cleaning.md
    - Performance Tips: tutorials/performance.md
    - Error Handling: tutorials/error_handling.md
  - Development:
    - Contributing: CONTRIBUTING.md
    - Code of Conduct: CODE_OF_CONDUCT.md
    - Security: SECURITY.md
  - Support:
    - Getting Help: SUPPORT.md
    - Changelog: CHANGELOG.md 